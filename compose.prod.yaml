services:
  db:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maguina}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in Dokploy}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ghcr.io/${GHCR_OWNER:?Define GHCR_OWNER}/${GHCR_OPS_IMAGE:-inversiones-maguina-ops}:production
    pull_policy: always
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL using host db}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-2}
      DATABASE_IDLE_TIMEOUT_SECONDS: ${DATABASE_IDLE_TIMEOUT_SECONDS:-20}
      UPLOADS_DIR: /data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
    command:
      [
        "sh",
        "-c",
        "cd packages/database && node node_modules/drizzle-kit/bin.cjs migrate",
      ]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  api:
    image: ghcr.io/${GHCR_OWNER:?Define GHCR_OWNER}/${GHCR_API_IMAGE:-inversiones-maguina-api}:production
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL using host db}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_IDLE_TIMEOUT_SECONDS: ${DATABASE_IDLE_TIMEOUT_SECONDS:-20}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set to https://inversionesmaguina.network}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      AUTENTICACION_SECRETO: ${AUTENTICACION_SECRETO:?Set a unique random secret}
      AUTENTICACION_DURACION_SEGUNDOS: ${AUTENTICACION_DURACION_SEGUNDOS:-28800}
      AUTENTICACION_DURACION_RECORDAR_SEGUNDOS: ${AUTENTICACION_DURACION_RECORDAR_SEGUNDOS:-2592000}
      NUBEFACT_RUTA: ${NUBEFACT_RUTA:?Set the authorized NubeFact HTTPS URL}
      NUBEFACT_TOKEN: ${NUBEFACT_TOKEN:?Set the NubeFact server token}
      NUBEFACT_TIMEOUT_MS: ${NUBEFACT_TIMEOUT_MS:-20000}
      REGIMEN_TRIBUTARIO: ${REGIMEN_TRIBUTARIO:-RER}
      DESCUENTO_MAXIMO_PORCENTAJE: ${DESCUENTO_MAXIMO_PORCENTAJE:-0}
      APIS_PERU_TOKEN: ${APIS_PERU_TOKEN:-}
      SUNAT_SIRE_RUC: ${SUNAT_SIRE_RUC:-}
      SUNAT_SIRE_USUARIO_SOL: ${SUNAT_SIRE_USUARIO_SOL:-}
      SUNAT_SIRE_CLAVE_SOL: ${SUNAT_SIRE_CLAVE_SOL:-}
      SUNAT_SIRE_CLIENT_ID: ${SUNAT_SIRE_CLIENT_ID:-}
      SUNAT_SIRE_CLIENT_SECRET: ${SUNAT_SIRE_CLIENT_SECRET:-}
      IMAGEN_MAXIMO_BYTES: ${IMAGEN_MAXIMO_BYTES:-5242880}
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - private
      - dokploy-network
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  web:
    image: ghcr.io/${GHCR_OWNER:?Define GHCR_OWNER}/${GHCR_WEB_IMAGE:-inversiones-maguina-web}:production
    pull_policy: always
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,noexec,nosuid
      - /var/run:size=4m,noexec,nosuid
      - /tmp:size=16m,noexec,nosuid
    networks:
      - dokploy-network
    expose:
      - "80"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  uploads-data:

networks:
  private:
    internal: true
  dokploy-network:
    external: true
