services:
  db:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-magina_test}
      POSTGRES_USER: ${POSTGRES_USER:-ci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a disposable test password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - integration-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - integration-private

volumes:
  integration-postgres-data:

networks:
  integration-private:
    internal: true
