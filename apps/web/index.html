<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1d36" />
    <meta name="description" content="Sistema de ventas, inventario y facturación de Inversiones Maguiña." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Inversiones Maguiña</title>
    <style>
      html, body { min-width: 320px; min-height: 100%; margin: 0; background: #071d3a; }
      .app-startup {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: 24px;
        color: #f5f8fd;
        font: 500 15px/1.5 Inter, "Segoe UI", sans-serif;
        text-align: center;
        background:
          radial-gradient(ellipse at 12% 4%, rgb(39 123 209 / 34%), transparent 42%),
          radial-gradient(ellipse at 100% 100%, rgb(17 82 148 / 34%), transparent 40%),
          linear-gradient(145deg, #0a3770 0%, #082956 47%, #04172f 100%);
      }
      .app-startup__content { width: min(100%, 340px); }
      .app-startup__mark {
        width: 54px;
        height: 4px;
        margin: 0 auto 22px;
        border-radius: 99px;
        background: linear-gradient(90deg, #ed293a 0 42%, #5eb6ff 42% 100%);
      }
      .app-startup__title { margin: 0 0 6px; font-size: 19px; font-weight: 750; }
      .app-startup__message { margin: 0; color: #c3d2e4; font-size: 13px; }
      .app-startup__progress {
        height: 3px;
        margin: 22px auto 0;
        overflow: hidden;
        border-radius: 99px;
        background: rgb(255 255 255 / 14%);
      }
      .app-startup__progress::after {
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ed293a, #67bdff);
        animation: app-startup-progress 1.25s ease-in-out infinite alternate;
        content: "";
      }
      @keyframes app-startup-progress { from { transform: translateX(-8%); } to { transform: translateX(180%); } }
      @media (prefers-reduced-motion: reduce) { .app-startup__progress::after { animation: none; width: 56%; margin: auto; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="app-startup" role="status" aria-live="polite">
        <div class="app-startup__content">
          <div class="app-startup__mark" aria-hidden="true"></div>
          <h1 class="app-startup__title">Inversiones Maguiña</h1>
          <p class="app-startup__message">Cargando el inicio de sesión…</p>
          <div class="app-startup__progress" aria-hidden="true"></div>
        </div>
      </main>
    </div>
    <noscript>Activa JavaScript para ingresar al sistema de Inversiones Maguiña.</noscript>
    <script type="module" src="/src/main/main.tsx"></script>
  </body>
</html>
